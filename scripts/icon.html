<!doctype html>
<!-- Full-bleed version of public/favicon.svg, for PNG icons (iOS and Android round the corners). -->
<html>
  <head>
    <style>
      * { margin: 0; }
      html, body { overflow: hidden; background: #1b1d24; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" fill="#1b1d24" />
      <rect x="7" y="7" width="12" height="18" fill="none" stroke="#f2f3f0" stroke-width="2" />
      <rect x="21" y="19" width="6" height="6" fill="#2340d0" />
    </svg>
    <script>
      // Headless windows have a minimum width, so size the icon explicitly (?size=192)
      const size = new URLSearchParams(location.search).get('size') ?? '512'
      document.querySelector('svg').setAttribute('width', size)
      document.querySelector('svg').setAttribute('height', size)
    </script>
  </body>
</html>
