<!doctype html>
<!-- Source for public/og-image.png (1200×630). Rendered by `npm run og`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2') format('woff2');
        font-weight: 200 800;
        font-stretch: 75% 100%;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 400 700;
      }
      @font-face {
        font-family: 'Mono';
        src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 56px;
        padding: 64px 72px;
        background: #f2f3f0;
        color: #1b1d24;
        font-family: 'Instrument', system-ui, sans-serif;
      }
      /* faint 12-column blueprint grid, as in the hero's structure view */
      body::before {
        content: '';
        position: absolute;
        inset: 0 72px;
        background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 12 - 1px), #d5d7d1 calc(100% / 12 - 1px) calc(100% / 12));
        opacity: 0.6;
        z-index: -1;
      }
      .text { display: flex; flex-direction: column; justify-content: space-between; }
      .tag {
        font-family: 'Mono', monospace;
        font-size: 20px;
        letter-spacing: 0.02em;
        color: #2340d0;
      }
      h1 {
        font-family: 'Bricolage', sans-serif;
        font-weight: 700;
        font-stretch: 75%;
        font-size: 150px;
        line-height: 0.86;
        letter-spacing: -0.035em;
        text-transform: uppercase;
      }
      h1 span { display: block; }
      h1 span + span { padding-left: 1.1em; }
      .role { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
      .meta { margin-top: 10px; font-size: 22px; color: #5d616b; }
      figure {
        position: relative;
        align-self: end;
        aspect-ratio: 4 / 5;
        border-radius: 6px;
        overflow: hidden;
        background: #dcded8;
      }
      figure img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
      .mark {
        position: absolute;
        right: 72px;
        top: 64px;
        width: 28px;
        height: 28px;
        background: #2340d0;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="tag">ridhofaauzi.com</p>
      <h1><span>Ridho</span><span>Fauzi</span></h1>
      <div>
        <p class="role">Full Stack Developer</p>
        <p class="meta">React · Laravel · Node.js · Go · Odoo — Depok, Indonesia</p>
      </div>
    </div>
    <figure><img src="../src/assets/profile.webp" alt="" /></figure>
    <span class="mark"></span>
  </body>
</html>
